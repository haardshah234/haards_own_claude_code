[project]
name = "haard-claude"
version = "0.1.0"
description = ""
authors = [
    {name = "Haard Shah"}
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "python-dotenv (>=1.2.4,<2.0.0)",
    "openai (>=3.41.0,<4.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.14.2,<3.0.0)",
    "langchain (>=1.4.7,<2.0.0)",
    "langchain-anthropic (>=1.7.7,<2.0.0)",
    "langchain-openai (>=1.7.3,<2.0.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-deepseek (>=1.1.1,<2.0.0)",
    "langchain-huggingface (>=1.2.3,<2.0.0)",
    "tree-sitter (==0.21.3)",
    "tree-sitter-languages (==1.10.2)",
    "langchain-qdrant (>=1.1.0,<2.0.0)",
    "fastembed (>=0.9.1,<0.10.0)",
    "langgraph-checkpoint-sqlite (>=3.1.3,<4.0.0)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)",
    "watchdog (>=7.0.0,<8.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "redisvl (>=0.29.0,<0.30.0)"
]

[tool.poetry]
packages = [
    { include = "haard_claude" }
]

[tool.poetry.scripts]
haard_claude = "haard_claude.main:run"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
