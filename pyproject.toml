[project]
name = "agentic-ai-course"
version = "0.1.0"
description = ""
authors = [
    {name = "Haard Shah",email = "haard.shah2004@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.15,<4.0.0"
dependencies = [
    "langchain (>=1.4.7,<2.0.0)",
    "langchain-openai (>=1.7.3,<2.0.0)",
    "langgraph (>=1.2.18,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "langchain-anthropic (>=1.7.7,<2.0.0)",
    "langchain-huggingface (>=1.2.3,<2.0.0)"
]

[tool.poetry]
packages = [{include = "haard_claude", from = "src"}]

[tool.poetry.scripts]
haard_claude = "haard_claude.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
